# Reverse proxy in front of the API.
#
# Three jobs: terminate TLS, refuse oversized bodies before they reach the
# application, and hold the connection open long enough for an analysis to
# finish without the default 60s gateway timeout cutting it off.

upstream labs_api {
    server api:8000;
    keepalive 32;
}

# Rate limit by client address as a coarse outer bound. The per-key limiter
# inside the application is the real control; this only blunts a flood that
# would otherwise reach it.
limit_req_zone $binary_remote_addr zone=labs_api:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # The health check must answer over plain HTTP so a load balancer can
    # reach it without a certificate.
    location = /health {
        proxy_pass http://labs_api/health;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Must be at least LABS_MAX_UPLOAD_MB, or nginx rejects the upload with a
    # bare 413 before the application can return its own error envelope and
    # the caller gets an HTML error page instead of JSON.
    client_max_body_size 60m;
    client_body_buffer_size 1m;

    location = /health {
        proxy_pass http://labs_api/health;
        access_log off;
    }

    location / {
        limit_req zone=labs_api burst=20 nodelay;

        proxy_pass http://labs_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Submissions return a job id in well under a second; these timeouts
        # exist for the upload of a large file, not for the analysis, which
        # never holds the connection.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream the upload through rather than spooling the whole body to
        # disk first: the application enforces its own size cap as it reads.
        proxy_request_buffering off;
    }
}
